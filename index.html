<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task Unlock</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #111827, #1e3a8a);
      color: white;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 420px;
      background: rgba(255,255,255,0.1);
      backdrop-filter: blur(15px);
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 20px;
      padding: 30px 20px;
      text-align: center;
      box-shadow: 0 20px 50px rgba(0,0,0,0.3);
    }

    h1 {
      margin-bottom: 10px;
    }

    .subtitle {
      color: #d1d5db;
      margin-bottom: 25px;
    }

    .task {
      background: rgba(255,255,255,0.08);
      border-radius: 15px;
      padding: 20px;
      margin: 15px 0;
    }

    .task h2 {
      font-size: 19px;
      margin-bottom: 8px;
    }

    .task p {
      color: #d1d5db;
      margin-bottom: 15px;
      font-size: 14px;
    }

    button {
      width: 100%;
      padding: 13px;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.2s;
    }

    .youtube {
      background: #ff0000;
      color: white;
    }

    .unlock {
      background: #22c55e;
      color: white;
    }

    button:hover {
      transform: scale(1.02);
      opacity: 0.9;
    }

    .key-box {
      display: none;
      margin-top: 20px;
      padding: 20px;
      background: #020617;
      border: 1px solid #334155;
      border-radius: 12px;
      text-align: left;
    }

    .key-box div {
      margin: 10px 0;
      word-break: break-all;
    }

    .key-box strong {
      color: #60a5fa;
    }

    .copy-btn {
      margin-top: 10px;
      background: #2563eb;
      color: white;
    }

    .success {
      color: #4ade80;
      font-size: 13px;
      margin-top: 10px;
      display: none;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>🎯 Complete Tasks</h1>
    <p class="subtitle">Complete the tasks to unlock your key.</p>

    <!-- TASK 1 -->
    <div class="task">
      <h2>🔴 Subscribe My YouTube Channel</h2>
      <p>Subscribe to my YouTube channel.</p>

      <button class="youtube"
        onclick="window.open('https://youtube.com/@rathore9-w9i?si=o8B2mqeLz9ILs_2K', '_blank')">
        Subscribe Channel
      </button>
    </div>

    <!-- TASK 2 -->
    <div class="task">
      <h2>🔐 Unlock Key</h2>
      <p>Click below to reveal your key.</p>

      <button class="unlock" onclick="unlockKey()">
        Unlock Key
      </button>

      <div class="key-box" id="keyBox">

        <div>
          <strong>Username:</strong><br>
          <span id="username">AimAi-2_C7C86</span>
        </div>

        <div>
          <strong>Password:</strong><br>
          <span id="password">JG6g0f3Z</span>
        </div>

        <button class="copy-btn" onclick="copyKey()">
          📋 Copy Username & Password
        </button>

        <p class="success" id="success">
          ✓ Copied successfully!
        </p>

      </div>
    </div>

  </div>

  <script>
    function unlockKey() {
      document.getElementById("keyBox").style.display = "block";
    }

    function copyKey() {
      const username = document.getElementById("username").innerText;
      const password = document.getElementById("password").innerText;

      const text =
        "Username: " + username +
        "\nPassword: " + password;

      navigator.clipboard.writeText(text).then(() => {
        document.getElementById("success").style.display = "block";

        setTimeout(() => {
          document.getElementById("success").style.display = "none";
        }, 2000);
      });
    }
  </script>

</body>
</html>
