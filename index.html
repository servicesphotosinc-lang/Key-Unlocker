<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Complete Task</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #0f172a, #1e3a8a);
      color: white;
      padding: 20px;
    }

    .box {
      width: 100%;
      max-width: 420px;
      background: rgba(255,255,255,0.1);
      backdrop-filter: blur(15px);
      padding: 30px 20px;
      border-radius: 20px;
      text-align: center;
      box-shadow: 0 20px 50px rgba(0,0,0,.35);
    }

    h1 {
      margin-bottom: 10px;
    }

    .subtitle {
      color: #cbd5e1;
      margin-bottom: 25px;
    }

    .task {
      background: rgba(255,255,255,.08);
      padding: 22px;
      border-radius: 15px;
    }

    .task h2 {
      margin-bottom: 10px;
    }

    .task p {
      color: #cbd5e1;
      font-size: 14px;
      margin-bottom: 18px;
    }

    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .youtube {
      background: #ff0000;
      color: white;
    }

    .unlock {
      background: #22c55e;
      color: white;
    }

    .key {
      display: none;
      margin-top: 20px;
      padding: 18px;
      background: #020617;
      border-radius: 12px;
      text-align: left;
      border: 1px solid #334155;
    }

    .key p {
      margin: 10px 0;
      color: white;
    }

    .key span {
      color: #60a5fa;
      word-break: break-all;
    }

    #unlockTask {
      display: none;
    }
  </style>
</head>

<body>

  <div class="box">

    <h1>🎯 Complete Task</h1>
    <p class="subtitle">Complete the task to unlock your key.</p>

    <!-- FIRST TASK -->
    <div class="task" id="subscribeTask">

      <h2>🔴 Subscribe My YouTube Channel</h2>

      <p>
        First subscribe to my YouTube channel.
      </p>

      <button class="youtube" onclick="openYouTube()">
        Subscribe Channel
      </button>

    </div>


    <!-- SECOND TASK -->
    <div class="task" id="unlockTask">

      <h2>🔐 Unlock Key</h2>

      <p>
        You completed the first step. Now unlock your key.
      </p>

      <button class="unlock" onclick="showKey()">
        Unlock Key
      </button>

      <div class="key" id="key">

        <p>
          <b>Username:</b><br>
          <span>AimAi-2_C7C86</span>
        </p>

        <p>
          <b>Password:</b><br>
          <span>JG6g0f3Z</span>
        </p>

      </div>

    </div>

  </div>


  <script>

    function openYouTube() {

      window.open(
        "https://youtube.com/@rathore9-w9i?si=o8B2mqeLz9ILs_2K",
        "_blank"
      );

      // Show Unlock Key after opening YouTube
      setTimeout(function() {

        document.getElementById("subscribeTask").style.display = "none";
        document.getElementById("unlockTask").style.display = "block";

      }, 1000);
    }


    function showKey() {

      document.getElementById("key").style.display = "block";

    }

  </script>

</body>
</html>
